name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - run: |
          gh release create \
            "${{ github.ref_name }}" \
            --generate-notes \
            dist/code-playground-react.js \
            dist/code-playground-react.js.map
        env:
          GH_TOKEN: ${{ github.token }}
