<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo</title>
</head>
<body>

  <h2>Editor</h2>
  <hr>
  <h3>Script como conteúdo</h3>
  <code-playground-react id="demo">
    <script type="text/plain">
      import { useState } from 'react';

      function HelloWorld() {
        const [count, setCount] = useState(0);
        return (
          <div style={{ textAlign: "center", padding: "20px" }}>
          <h1>Hello, React!</h1>
          <p>Count: {count}</p>
          <button onClick={() => setCount(c => c + 1)}>
            Increment
          </button>
          </div>
        );
      }

      export default HelloWorld;
    </script>
  </code-playground-react>

  <h3>Atributo Code</h3>
  <code-playground-react
    code="
      import { useState } from 'react';
      function Greeting() {
        const [name, setName] = useState('World');
        return (
          <div style={{ textAlign: 'center', padding: '20px' }}>
            <h1>Hello, {name}!</h1>
            <input
              value={name}
              onChange={e => setName(e.target.value)}
              placeholder='Type a name'
            />
          </div>
        );
      }
      export default Greeting;
    "
  ></code-playground-react>
  
  <h2>Temas</h2>
  <hr>
  <h3>theme="dracula"</h3>
  <code-playground-react theme="dracula">
  </code-playground-react>
  <h3>theme="dark"</h3>
  <code-playground-react theme="dark">
  </code-playground-react>
  <h3>theme="light"</h3>
  <code-playground-react theme="light">
  </code-playground-react>
  <h3>theme="nord"</h3>
  <code-playground-react theme="nord">
  </code-playground-react>

  <script src="dist/code-playground-react.js"></script>
</body>
</html>
